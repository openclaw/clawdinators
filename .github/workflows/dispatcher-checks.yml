name: Dispatcher checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dispatch identity and synthetic intake
        run: node --test scripts/tests/clawsweeper-dispatch.test.cjs
