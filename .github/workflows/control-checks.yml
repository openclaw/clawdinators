name: Control API checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test control API validation and dispatch
        run: node --test control/api/handler.test.js
